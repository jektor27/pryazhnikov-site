<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 — Страница не найдена | pryazhnikov-ai.ru</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.ico">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css?v=3">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .error-wrap { text-align: center; max-width: 520px; padding: 40px 20px; }
        .error-code { font-size: 5rem; font-weight: 800; color: var(--accent-cyan); line-height: 1; }
        .error-sub { font-size: 1.2rem; color: var(--gold); margin: 10px 0 20px; }
        .error-text { color: var(--muted); line-height: 1.7; margin-bottom: 30px; }
        .error-links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="error-wrap">
        <div class="error-code">404</div>
        <div class="error-sub">$ cd .. // страница не найдена</div>
        <p class="error-text">Такой страницы здесь нет — возможно, она переехала или была удалена. Начните с главной или посмотрите проекты и блог.</p>
        <div class="error-links">
            <a href="index.html" class="btn">На главную</a>
            <a href="projects.html" class="btn btn-outline">Проекты</a>
            <a href="contacts.html" class="btn btn-outline">Контакты</a>
        </div>
    </div>
</body>
</html>
